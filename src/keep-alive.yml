name: Keep Supabase Project Active

# Free Supabase projects auto-pause after 7 days with zero activity.
# This workflow pings the database on a schedule so that never happens.
on:
  schedule:
    - cron: "0 14 * * *"   # every day at 14:00 UTC
  workflow_dispatch: {}      # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/kv_store?select=user_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
