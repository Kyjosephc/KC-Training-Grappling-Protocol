<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Open Mat</title>
    <meta name="description" content="Strength & conditioning training program for grapplers." />
    <!-- Per scheme, so the status-bar area is not black behind a light app. The
         values are the --bg tokens from the two themes in App.jsx. -->
    <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Open Mat" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* The first paint happens before React mounts and before the saved theme is
         read, so a hardcoded black here meant every light-theme launch opened
         with a black screen and then flashed. Follow the system preference for
         that first frame instead; the app takes over from there. */
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #eceef1; }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background: #000000; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
