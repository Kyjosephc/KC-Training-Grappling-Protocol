<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Infiniti Kryos</title>
    <meta name="description" content="Strength & conditioning training program for grapplers." />
    <!-- Per scheme, so the status-bar area is not black behind a light app. The
         values are the --bg tokens from the two themes in App.jsx. -->
    <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Infiniti Kryos" />

    <!-- The card that appears when somebody pastes the link into iMessage,
         WhatsApp, Instagram or Slack. Without these the link arrives as a bare
         URL, or an empty grey box, which is how a real app looks like a link
         to a spreadsheet. The image is the app's own wordmark on its own black
         and teal, so the preview and the first screen agree with each other.

         og:url is absolute because a preview is fetched by somebody else's
         server, which has no idea what page the link came from. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Infiniti Kryos" />
    <meta property="og:title" content="Infiniti Kryos — Strength &amp; Conditioning for Grapplers" />
    <meta property="og:description" content="A twelve-week strength and conditioning program for the athletes of Infiniti BJJ, with technique rooms and a competition rules game." />
    <meta property="og:url" content="https://open-mat.pages.dev" />
    <meta property="og:image" content="https://open-mat.pages.dev/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Infiniti Kryos — strength and conditioning for grapplers" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Infiniti Kryos — Strength &amp; Conditioning for Grapplers" />
    <meta name="twitter:description" content="A twelve-week strength and conditioning program for the athletes of Infiniti BJJ, with technique rooms and a competition rules game." />
    <meta name="twitter:image" content="https://open-mat.pages.dev/share-card.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* The first paint happens before React mounts and before the saved theme is
         read, so a hardcoded black here meant every light-theme launch opened
         with a black screen and then flashed. Follow the system preference for
         that first frame instead; the app takes over from there. */
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #eceef1; }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background: #000000; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
